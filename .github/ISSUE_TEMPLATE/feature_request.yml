name: 💡 Feature request
description: Suggest an idea or improvement
title: '[Feature]: '
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: Thanks for the idea! Please search existing issues and discussions first.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and why is it hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Sketch the behaviour, config, or UI.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New ecosystem (Go, Gradle, Composer, ...)
        - Ecosystem parser improvement
        - Unused-dependency detection
        - Version drift / registry data (e.g. vulnerabilities)
        - New report or view
        - REST API
        - Frontend / UX
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fall short.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, prior art, examples, or mockups.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues/discussions and this is not a duplicate
          required: true
        - label: I'm willing to help test or implement this
          required: false
